name: Cash trades check (evening)

on:
  schedule:
    # 16:20 IST and 19:40 IST, Monday to Friday
    - cron: "50 10 * * 1-5"
    - cron: "10 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cash-trades
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update and close open cash trades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m desk.cash_journal
