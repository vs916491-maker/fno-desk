name: Stock screener (hourly)

on:
  schedule:
    # ~5 min after each hourly candle closes: 10:20 ... 15:20 IST, and 15:35 IST
    - cron: "50 4-9 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside scan hours"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan F&O stocks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python -m desk.screener --force; else python -m desk.screener; fi
