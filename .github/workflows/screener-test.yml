name: Stock screener - test run (read-only)

# Manual only. Runs the screener against the live data but writes nothing, and prints
# both tabs (Price Action, Price+OI). "at" replays a past time today, e.g. 2026-11-06T14:20.
on:
  workflow_dispatch:
    inputs:
      at:
        description: "Replay as of this IST time (blank = now)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AT: ${{ github.event.inputs.at }}
        run: |
          if [ -n "$AT" ]; then python -m desk.screener --at "$AT"; else python -m desk.screener --dry --force; fi
