name: Keep schedules active

# GitHub switches off scheduled workflows in a repo with no commits for 60 days.
# The desk's jobs write to Supabase, not the repo, so this commits a tiny date
# file once a week to keep the 15-minute and hourly schedules running.
on:
  schedule:
    - cron: "17 3 * * 0"     # Sundays 08:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep schedules active" || exit 0
          git push
